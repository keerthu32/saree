<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kurinji Admin Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<header>
  <div>
    <strong>Kurinji Handloom Saree</strong>
    <div class="muted">Inventory & Order Admin</div>
  </div>
  <nav><a href="/">Storefront</a></nav>
</header>

<main class="container" style="grid-template-columns: 1fr;">
  <section class="card">
    <h2>Add Product</h2>
    <div class="row">
      <input id="sku" placeholder="SKU" />
      <input id="name" placeholder="Product name" />
      <input id="category" placeholder="Category" />
      <input id="price" type="number" step="0.01" placeholder="Price" />
      <input id="stock" type="number" placeholder="Stock quantity" />
      <button id="createProductBtn">Create Product</button>
    </div>
  </section>

  <section class="card">
    <h2>Inventory Adjustment</h2>
    <div class="row">
      <select id="adjustProduct"></select>
      <input id="adjustDelta" type="number" placeholder="Quantity delta (e.g. +5 or -3)" />
      <input id="adjustReason" placeholder="Reason" value="manual_adjustment" />
      <button id="adjustBtn">Adjust Stock</button>
    </div>
  </section>

  <section class="card">
    <h2>Products</h2>
    <table class="table" id="productsTable"></table>
  </section>

  <section class="card">
    <h2>Orders</h2>
    <table class="table" id="ordersTable"></table>
  </section>
</main>

<script src="/assets/admin.js"></script>
</body>
</html>
